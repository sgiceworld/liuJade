[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jade-inference"
version = "0.1.0"
description = "古玉鉴真 — 边缘端推理引擎"
requires-python = ">=3.10"
dependencies = [
    "onnxruntime>=1.18.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]
