[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jade-training"
version = "0.1.0"
description = "古玉鉴真 — 训练管线"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "timm>=1.0.0",
    "pytorch-lightning>=2.0.0",
    "albumentations>=1.4.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "onnx>=1.16.0",
    "onnx-simplifier>=0.4.0",
    "onnxruntime>=1.18.0",
    "mlflow>=2.10.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipywidgets",
    "matplotlib",
    "seaborn",
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
